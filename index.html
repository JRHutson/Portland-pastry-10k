<body>


<div id="map"></div>

<script src="../leaflet-mapbox-gl.js"></script>

<import "mapbox-gl-leaflet";></import>


<script>
    let baseMap = "https://api.mapbox.com/styles/v1/jrhutson/cmnqev8ht000h01rec5ch9k7j/tiles/256/{z}/{x}/{y}@2x?access_token=";
    let baseMapURL = baseMap.concat(myToken);
</script>

<script>

    const map = L.map('map').fitWorld();

    L.marker([38.912753, -77.032194])
        .bindPopup("Hello <b>Leaflet GL</b>!<br>Whoa, it works!")
        .addTo(map)
        .openPopup();

    L.tileLayer(baseMapURL, {
    maxZoom: 19,
    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);
    

    function onLocationFound(e) {
        const radius = e.accuracy / 2;

        const locationMarker = L.marker(e.latlng).addTo(map)
            .bindPopup(`You are within ${radius} meters from this point`).openPopup();

        const locationCircle = L.circle(e.latlng, radius).addTo(map);
    }

    function onLocationError(e) {
        alert(e.message);
    }

    map.on('locationfound', onLocationFound);
    map.on('locationerror', onLocationError);

    map.locate({setView: true, maxZoom: 16});
</script>



</body>
