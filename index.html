<!DOCTYPE html>
<html lang="en">
<head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <title>Portland Pastry 10K</title>
    
    <link rel="shortcut icon" type="image/x-icon" href="docs/images/favicon.ico" />

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.5.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.5.1/dist/leaflet.js"></script>

    <!-- Leaflet Locate Control-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@[VERSION]/dist/L.Control.Locate.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol@[VERSION]/dist/L.Control.Locate.min.js" charset="utf-8"></script>
    
    <!-- Mapbox GL -->
    <link href="https://api.tiles.mapbox.com/mapbox-gl-js/v1.2.0/mapbox-gl.css" rel='stylesheet' />
    <script src="https://api.tiles.mapbox.com/mapbox-gl-js/v1.2.0/mapbox-gl.js"></script>

	<!-- jQuery -->
	<script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>


    <script src="leaflet-mapbox-gl.js"></script>

    <script type="text/javascript" src="token.js"></script> 

    <script type="text/javascript" src="./data/vendors.js"></script> 

    <script type="text/javascript" src="./data/route.js"></script> 


    <style  >
        html, body {
            height: 100%;
            margin: 0;
        }
        .leaflet-container {
            height: 400px;
            width: 600px;
            max-width: 100%;
            max-height: 100%;
        }
    </style>
    <style>body { padding: 0; margin: 0; } #map { height: 100%; width: 100vw; }
    </style>
</head>
<body>


<div id="map"></div>

<script src="../leaflet-mapbox-gl.js"></script>

<import "mapbox-gl-leaflet";></import>


<script>
    let baseMap = "https://api.mapbox.com/styles/v1/jrhutson/cmnqev8ht000h01rec5ch9k7j/tiles/256/{z}/{x}/{y}@2x?access_token=";
    let baseMapURL = baseMap.concat(myToken);
</script>

<script>

    const map = L.map('map').fitWorld();

    L.tileLayer(baseMapURL, {
    maxZoom: 19,
    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
	}).addTo(map);
	
    var routeStyle = {
    "color": "#A61C3C",
    "weight": 5,
    "opacity": 0.65
    };

    L.geoJson(route, {style: routeStyle}).addTo(map);
    
    var vendorsLayer = L.geoJson(vendors, {
        style:{
            fillColor:"#A61C3C",
            color: "#D3F6DB",
            weight: 3,
            opacity: .5,
            fillOpacity: 1
            },
        pointToLayer: function(feature, latlon) {
        return L.circleMarker(latlon, 3).bindPopup("<h2>"+feature.properties.Name+"</h2>"+"<a href=" +feature.properties.Website+">Website</a>"+"<br><a href="+feature.properties.Instagram+">Instagram</a><br>"+feature.properties.Info);
        }
    }).addTo(map);

    
    map.fitBounds(vendorsLayer.getBounds().pad(0.5));

    
</script>



</body>
</html>
